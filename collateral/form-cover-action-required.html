<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Form cover — Action Required: Nations Cup & Coaches Welcome Event</title>
<!--
  Cover image for the Airtable "Action Required" form (Nations Cup tickets +
  Coaches Welcome Event RSVP), Nov 25 2026. 2460x300 (Airtable shows covers as a
  ~8:1 full-width strip and the form card overlaps the lower center), so all
  content sits in the top-center band. Render:
  node collateral/render-partner.mjs form-cover-action-required.html  (viewport overridden below via W/H env)
-->
<style>
  @font-face{font-family:"Big Shoulders Display";src:url(fonts/big-shoulders.woff2) format("woff2");font-weight:100 900}
  @font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono.woff2) format("woff2");font-weight:100 900}
  :root{--navy:#0A0A0B;--red:#FF2D8E;--chalk:#F7F5F6;--steel:#8A848C}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2460px;height:300px;overflow:hidden}
  body{background:var(--navy);color:var(--chalk);position:relative;font-family:"JetBrains Mono",monospace}
  .yards{position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0,transparent 158px,rgba(247,245,246,.045) 158px,rgba(247,245,246,.045) 160px)}
  .glow{position:absolute;left:50%;top:40%;width:2000px;height:420px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,45,142,.20) 0%,rgba(255,45,142,.06) 40%,transparent 70%)}
  .band{position:absolute;left:0;right:0;top:22px;height:136px;display:flex;align-items:center;justify-content:center;gap:40px}
  .cfs{height:128px;width:128px}
  .isi{height:100px;width:auto}
  .div{width:3px;height:104px;background:linear-gradient(to bottom,transparent,rgba(247,245,246,.45) 20%,rgba(247,245,246,.45) 80%,transparent)}
  .copy{display:flex;flex-direction:column;gap:10px;margin-left:16px}
  .kick{font-size:20px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
  h1{font-family:"Big Shoulders Display",sans-serif;font-weight:800;text-transform:uppercase;font-size:54px;line-height:1;white-space:nowrap}
  h1 em{font-style:normal;color:var(--red)}
</style>
</head>
<body>
  <div class="yards"></div>
  <div class="glow"></div>
  <div class="band">
    <img class="cfs" src="../public/logo.png" alt="College Flag Showcase Series" />
    <span class="div"></span>
    <img class="isi" src="../public/superflag.png" alt="International Superflag Invitational" />
    <span class="div"></span>
    <div class="copy">
      <p class="kick">Action Required &middot; Respond by Mon, Nov 30</p>
      <h1>Nations Cup Tickets <em>&amp;</em> Coaches Welcome Event</h1>
    </div>
  </div>
</body>
</html>
