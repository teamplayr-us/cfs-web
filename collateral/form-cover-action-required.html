<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Form cover — Action Required: Nations Cup & Coaches Welcome Event</title>
<!--
  Cover image for the Airtable "Action Required" form (Nations Cup tickets +
  Coaches Welcome Event RSVP), Nov 25 2026. 1600x600; content kept in the
  center so a cropped cover still reads. Render:
  node collateral/render-partner.mjs form-cover-action-required.html  (viewport overridden below via W/H env)
-->
<style>
  @font-face{font-family:"Big Shoulders Display";src:url(fonts/big-shoulders.woff2) format("woff2");font-weight:100 900}
  @font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono.woff2) format("woff2");font-weight:100 900}
  :root{--navy:#0A0A0B;--red:#FF2D8E;--chalk:#F7F5F6;--steel:#8A848C}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:600px;overflow:hidden}
  body{background:var(--navy);color:var(--chalk);position:relative;font-family:"JetBrains Mono",monospace}
  .yards{position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0,transparent 158px,rgba(247,245,246,.045) 158px,rgba(247,245,246,.045) 160px)}
  .glow{position:absolute;left:50%;top:50%;width:1500px;height:700px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,45,142,.18) 0%,rgba(255,45,142,.06) 40%,transparent 70%)}
  .inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:56px;padding:0 100px}
  .lockup{display:flex;align-items:center;gap:40px;flex-shrink:0}
  .cfs{width:200px;height:200px}
  .isi{width:230px;height:auto}
  .div{width:3px;height:170px;background:linear-gradient(to bottom,transparent,rgba(247,245,246,.45) 20%,rgba(247,245,246,.45) 80%,transparent)}
  .copy{display:flex;flex-direction:column;gap:18px}
  .kick{font-size:24px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--red)}
  h1{font-family:"Big Shoulders Display",sans-serif;font-weight:800;text-transform:uppercase;font-size:74px;line-height:.95;letter-spacing:.005em;white-space:nowrap}
  h1 em{font-style:normal;color:var(--red)}
  .by{font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  .by b{color:var(--chalk)}
</style>
</head>
<body>
  <div class="yards"></div>
  <div class="glow"></div>
  <div class="inner">
    <div class="lockup">
      <img class="cfs" src="../public/logo.png" alt="College Flag Showcase Series" />
      <span class="div"></span>
      <img class="isi" src="../public/superflag.png" alt="International Superflag Invitational" />
    </div>
    <div class="copy">
      <p class="kick">Action Required</p>
      <h1>Nations Cup Tickets<br><em>&amp;</em> Coaches Welcome Event</h1>
      <p class="by">Respond by <b>Mon, Nov 30</b></p>
    </div>
  </div>
</body>
</html>
