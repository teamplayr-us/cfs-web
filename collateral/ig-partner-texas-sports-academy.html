<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>IG — Partner Announcement: Texas Sports Academy</title>
<!--
  Partnership announcement — Texas Sports Academy, Official Coaching Partner
  of the Showcase Combine & Camp; their staff lead the camp (founder, Nov 24
  2026). Date/venue from data/events.ts (mckinney-tx). Cloned from
  ig-partner-gamebreaker.html. Render:
  node collateral/render-partner.mjs ig-partner-texas-sports-academy.html
  Partner logo: invites/texas-sports-academy.png (white wordmark, transparent).
-->
<style>
  @font-face{font-family:"Big Shoulders Display";src:url(fonts/big-shoulders.woff2) format("woff2");font-weight:100 900}
  @font-face{font-family:"Archivo";src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900}
  @font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono.woff2) format("woff2");font-weight:100 900}
  :root{
    --navy:#0A0A0B; --red:#FF2D8E; --chalk:#F7F5F6; --steel:#8A848C;
    --display:"Big Shoulders Display",sans-serif;
    --body:"Archivo",sans-serif;
    --mono:"JetBrains Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{font-family:var(--body);background:var(--navy);color:var(--chalk);position:relative}

  .yards{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 133px,rgba(247,245,246,.045) 133px,rgba(247,245,246,.045) 135px)}
  .hash{position:absolute;top:0;bottom:0;width:2px;background:rgba(247,245,246,.05)}
  .hash.l{left:96px}.hash.r{right:96px}
  /* pink glow behind the lockup */
  .glow{position:absolute;left:50%;top:280px;width:1100px;height:720px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,45,142,.20) 0%,rgba(255,45,142,.07) 38%,transparent 68%)}
  .frame{position:absolute;inset:36px;border:3px solid rgba(247,245,246,.16)}

  /* Type scale, tuned for phone viewing (a 1080px post shows at ~1/3 size):
     H1 136 > partner name 64 > event line 50 > info bar 27 > footer 22.
     Nothing under 22px; pink only on the role words + the city chip. */
  .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:104px 100px 82px}

  .lockup{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:64px;height:270px}
  .cfs-logo{width:240px;height:240px}
  .divider{width:3px;height:200px;background:linear-gradient(to bottom,transparent,rgba(247,245,246,.45) 20%,rgba(247,245,246,.45) 80%,transparent)}
  .gb-logo{height:150px;width:auto}

  .name{margin-top:auto;font-family:var(--mono);font-weight:700;font-size:28px;line-height:1;letter-spacing:.3em;text-transform:uppercase;color:var(--red);padding-left:.3em}
  h1{margin-top:30px;font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.88;letter-spacing:.005em;font-size:136px;white-space:nowrap}
  h1 em{font-style:normal;color:var(--red)}
  .of{margin-top:40px;font-family:var(--display);text-transform:uppercase;font-size:50px;letter-spacing:.04em;line-height:1;font-weight:800;color:var(--chalk)}
  .of span{font-weight:700;color:var(--steel)}
  .sub{margin-top:26px;font-family:var(--body);font-size:32px;line-height:1.35;color:var(--steel);font-weight:500}
  .sub b{color:var(--chalk);font-weight:700}

  .bar{margin-top:auto;margin-bottom:0;display:flex;align-items:stretch;border:3px solid rgba(247,245,246,.24)}
  .bar span{padding:19px 26px;font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
  .bar span + span{border-left:3px solid rgba(247,245,246,.24)}
  .bar .hot{background:var(--red);color:var(--navy)}

  .foot{margin-top:28px;display:flex;align-items:center;gap:20px;font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--steel)}
  .foot b{color:var(--chalk)}
  .foot i{width:9px;height:9px;background:var(--red);display:inline-block}
</style>
</head>
<body>
  <div class="yards"></div>
  <div class="hash l"></div>
  <div class="hash r"></div>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="inner">
    <div class="lockup">
      <img class="cfs-logo" src="../public/logo.png" alt="College Flag Showcase Series" />
      <span class="divider"></span>
      <img class="gb-logo" src="invites/texas-sports-academy.png" alt="Texas Sports Academy" />
    </div>

    <p class="name">Partner Announcement</p>
    <h1>Official<br><em>Coaching</em><br>Partner</h1>
    
    <div class="bar">
      <span class="hot">Dallas</span>
      <span>Fri, Dec 11, 2026</span>
      <span>Craig Ranch</span>
    </div>

    <p class="foot"><b>collegeflagshowcase.com</b><i></i>Girls Flag Football</p>
  </div>
</body>
</html>
